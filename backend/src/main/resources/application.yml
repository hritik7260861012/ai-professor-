server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ai-professor-assistant
  datasource:
    # Credentials come from the environment — never commit real values.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/professor_assistant}
    username: ${SPRING_DATASOURCE_USERNAME:professor_assistant}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
  jpa:
    hibernate:
      # Schema is managed exclusively by Flyway migrations.
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    # Dialect is auto-detected from the JDBC URL (PostgreSQL in production,
    # H2-in-PostgreSQL-mode in tests).
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  api:
    version: 1.0.0
    title: AI Professor Assistant API
    description: >-
      REST API for the AI Professor Assistant platform. Phase 1 delivers project
      scaffolding, a health endpoint, consistent structured errors, API
      documentation, and the initial database schema. Authentication, courses,
      assignments and AI features are planned for later phases.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.professor.assistant: DEBUG
    org.springframework.web: INFO
    org.hibernate: WARN
