spring:
  datasource:
    url: jdbc:h2:mem:professor_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  syllabus:
    # Tests must never write into the project directory; use a temp folder
    # so a test run leaves no artefacts behind.
    storage-directory: ${java.io.tmpdir}/professor-assistant-test-syllabi
  ai:
    # Deterministic provider: every Phase 5 test runs without a real API key
    # and never makes a live AI call.
    provider: MOCK
    model: mock-model-v1

logging:
  level:
    com.professor.assistant: WARN
