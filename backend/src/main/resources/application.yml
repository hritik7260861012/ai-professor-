server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      # Session cookies expire after 30 minutes of inactivity.
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        # Lax prevents the cookie riding along with cross-site POSTs
        # (CSRF defence in depth) while allowing top-level navigation.
        same-site: lax
        # Set to true in production when TLS is terminated in front of the app.
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: ai-professor-assistant
  servlet:
    multipart:
      enabled: true
      # Ceiling enforced by the container before our own validator runs.
      # Kept above app.syllabus.max-file-size so the validator can return a
      # friendly "too large" message instead of a raw 413 from the container.
      max-file-size: ${APP_SYLLABUS_MAX_UPLOAD_SIZE:11MB}
      max-request-size: ${APP_SYLLABUS_MAX_UPLOAD_SIZE:11MB}
  datasource:
    # Credentials come from the environment — never commit real values.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/professor_assistant}
    username: ${SPRING_DATASOURCE_USERNAME:professor_assistant}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
  jpa:
    hibernate:
      # Schema is managed exclusively by Flyway migrations.
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    # Dialect is auto-detected from the JDBC URL (PostgreSQL in production,
    # H2-in-PostgreSQL-mode in tests).
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  api:
    version: 1.0.0
    title: AI Professor Assistant API
    description: >-
      REST API for the AI Professor Assistant platform. Phase 1 delivered project
      scaffolding, a health endpoint, consistent structured errors, API documentation
      and the initial database schema. Phase 2 adds authentication (BCrypt, session
      cookies, CSRF) and role-based access control for ADMIN, TEACHER and STUDENT.
      Phase 3 adds the academic structure (departments, programs, semesters,
      subjects, classes, enrollments, teaching assignments). Phase 4 adds syllabus
      upload, deterministic text extraction and teacher review. AI-generated study
      material is planned for later phases.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap:
    admin:
      # First-admin bootstrap for LOCAL DEVELOPMENT ONLY.
      #
      # Master switch, default false. Creating an account additionally
      # requires the email and password below, so this stays off unless a
      # developer turns it on deliberately. There is no public admin
      # registration endpoint; public sign-up is STUDENT-only.
      #
      # Supply via the environment, never commit real values:
      #   APP_BOOTSTRAP_ADMIN_ENABLED=true
      #   APP_BOOTSTRAP_ADMIN_EMAIL=<your-admin-email>
      #   APP_BOOTSTRAP_ADMIN_PASSWORD=<strong-password>
      enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:false}
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
      # LOCAL DEVELOPMENT ONLY. Overrides the password of an account that
      # already holds ADMIN, for when the original bootstrap password is
      # lost. Defaults to false, and the bean only exists when this is
      # explicitly true, so there is no reset code path by default.
      #
      # It never creates an account and never touches a non-ADMIN account.
      # There is deliberately no HTTP endpoint for password changes.
      # Switch it back off once you have signed in.
      reset-password: ${APP_BOOTSTRAP_ADMIN_RESET_PASSWORD:false}
  syllabus:
    # Private storage for uploaded syllabus files.
    # Keep this OUTSIDE frontend/public so nothing can be served as a static
    # asset; point it at a dedicated volume in production.
    storage-directory: ${APP_SYLLABUS_STORAGE_DIR:./private-storage/syllabi}
    # 10 MB. Raising this also requires raising the multipart limits above.
    max-file-size: ${APP_SYLLABUS_MAX_FILE_SIZE:10485760}
    max-extracted-characters: ${APP_SYLLABUS_MAX_CHARACTERS:500000}
    max-pdf-pages: ${APP_SYLLABUS_MAX_PDF_PAGES:300}
  ai:
    # GEMINI (real provider) or MOCK (deterministic, for tests and local
    # demos). MOCK is never selected automatically, so a production server
    # with a missing key reports a configuration error instead of serving
    # fabricated content.
    provider: ${APP_AI_PROVIDER:GEMINI}
    # Read from the environment only. Never logged, never returned by the
    # API, never sent to the frontend.
    api-key: ${GEMINI_API_KEY:}
    # Free-tier eligible Flash model. Model ids change often; override this
    # without a rebuild.
    model: ${APP_AI_MODEL:gemini-3.8-flash}
    base-url: ${APP_AI_BASE_URL:https://generativelanguage.googleapis.com}
    api-version: ${APP_AI_API_VERSION:v1beta}
    timeout-seconds: ${APP_AI_TIMEOUT_SECONDS:60}
    # Bounded attempts, and only for retryable provider failures.
    max-attempts: ${APP_AI_MAX_ATTEMPTS:3}
    # Cost guards. The daily quota is counted from the database and is
    # advisory, not billing-grade.
    max-concurrent-jobs: ${APP_AI_MAX_CONCURRENT_JOBS:2}
    max-concurrent-jobs-per-user: ${APP_AI_MAX_CONCURRENT_PER_USER:1}
    daily-quota-per-user: ${APP_AI_DAILY_QUOTA:50}
    max-items: ${APP_AI_MAX_ITEMS:30}
    max-instruction-length: ${APP_AI_MAX_INSTRUCTION_LENGTH:500}
    max-content-characters: ${APP_AI_MAX_CONTENT_CHARACTERS:200000}
    stale-job-minutes: ${APP_AI_STALE_JOB_MINUTES:15}
    duplicate-window-seconds: ${APP_AI_DUPLICATE_WINDOW_SECONDS:60}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.professor.assistant: DEBUG
    org.springframework.web: INFO
    org.hibernate: WARN
    # POI and PDFBox are chatty at DEBUG; keep their output out of the way.
    org.apache.pdfbox: WARN
    org.apache.poi: WARN